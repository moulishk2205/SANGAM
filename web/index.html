<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/thread.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>SANGAM — Material Intelligence</title>
    <meta
      name="description"
      content="SANGAM resolves the many ways organisations describe the same material into one canonical material identity, and keeps every original code attached to it. SIH26099 — Ministry of Petroleum and Natural Gas / CPCL."
    />
  </head>
  <script>
    // Runs before first paint. Without it, an explicit choice is applied by
    // React after mount and the page flashes the other theme first. Wrapped
    // because localStorage throws outright in some privacy modes rather than
    // returning null, and a theme preference is not worth a blank page.
    try {
      var t = localStorage.getItem('sangam-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
