<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
  <title id="t">SANGAM — Material Intelligence</title>
  <desc id="d">Four organisations describe the same stainless steel M10 by 50 hex bolt four different ways; threads converge them into one national material code, NMC-5306-SS-0100-ADT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1214"/><stop offset="1" stop-color="#13181a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.66" r="0.42">
      <stop offset="0" stop-color="#3ccfa4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3ccfa4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="th" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b666c"/><stop offset="1" stop-color="#3ccfa4"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#2a3135" stroke-width="0.6" opacity="0.55"/>
    </pattern>
  </defs>
  <style>
    .row { opacity: 0; animation: rowIn 9s ease-out infinite; }
    @keyframes rowIn { 0% { opacity: 0; transform: translateX(-10px); } 6% { opacity: 1; transform: none; }
                        90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .thread { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 9s cubic-bezier(.6,0,.2,1) infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 1; opacity: 1; } 11% { stroke-dashoffset: 0; }
                       88% { stroke-dashoffset: 0; opacity: 1; } 95%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    .dot { opacity: 0; animation: dot 9s linear infinite; }
    @keyframes dot { 0%, 6% { opacity: 0; } 7% { opacity: 1; } 19% { opacity: 1; } 22%, 100% { opacity: 0; } }
    .canon { opacity: 0; animation: canon 9s ease-out infinite; animation-delay: 2.2s; }
    @keyframes canon { 0% { opacity: 0; transform: scale(.97); } 7% { opacity: 1; transform: none; }
                        72% { opacity: 1; } 80%, 100% { opacity: 0; } }
    .canon { transform-box: fill-box; transform-origin: center; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .row, .thread, .dot, .canon, .pulse { animation: none !important; opacity: 1; stroke-dashoffset: 0; }
    }
  </style>

  <rect width="1200" height="460" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="460" rx="22" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="459" rx="21.5" fill="none" stroke="#2a3135"/>

  <!-- wordmark -->
  <g transform="translate(40 58)">
    <rect width="40" height="40" rx="10" fill="#3ccfa4"/>
    <path d="M20 9 L30 14.5 L30 25.5 L20 31 L10 25.5 L10 14.5 Z" fill="none" stroke="#0f1214" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M10 14.5 L20 20 L30 14.5 M20 20 L20 31" fill="none" stroke="#0f1214" stroke-width="2.4" stroke-linejoin="round"/>
  </g>
  <text x="96" y="94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="760" letter-spacing="7" fill="#e9eef0">SANGAM</text>
  <text x="364" y="93" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#8a969c">संगम · where rivers meet</text>
  <text x="40" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="600" fill="#e9eef0">Many CPSE material codes. <tspan fill="#3ccfa4">One national identity.</tspan></text>

  <g font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12" letter-spacing="0.8">
    <rect x="896" y="56" width="264" height="30" rx="15" fill="#1f2629" stroke="#2a3135"/>
    <circle cx="916" cy="71" r="4" fill="#3ccfa4"/>
    <circle class="pulse" cx="916" cy="71" r="4" fill="#3ccfa4"/>
    <text x="930" y="75" fill="#e9eef0">SMART INDIA HACKATHON 2026</text>
    <text x="1160" y="112" text-anchor="end" fill="#8a969c">SIH26099 · MoP&amp;NG / CPCL</text>
  </g>

  <text x="40" y="178" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#5b666c">AS EACH ORGANISATION WROTE IT</text>
  <text x="788" y="178" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#5b666c">ONE CANONICAL IDENTITY</text>
  
  <g class="row" style="animation-delay:0.15s">
    <rect x="40" y="190" width="460" height="44" rx="10" fill="#1a1f22" stroke="#2a3135"/>
    <text x="58" y="208" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11" fill="#8a969c" letter-spacing="0.6">CPSE-A · new request</text>
    <text x="58" y="225" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="14.5" fill="#e9eef0">SS HEX BOLT M10 X 50</text>
    <circle cx="500" cy="212" r="3" fill="#5b666c"/>
  </g>
  <g class="row" style="animation-delay:0.27s">
    <rect x="40" y="246" width="460" height="44" rx="10" fill="#1a1f22" stroke="#2a3135"/>
    <text x="58" y="264" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11" fill="#8a969c" letter-spacing="0.6">CPSE-B · BLT-30187</text>
    <text x="58" y="281" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="14.5" fill="#e9eef0">BOLT HEX SS M10*50</text>
    <circle cx="500" cy="268" r="3" fill="#5b666c"/>
  </g>
  <g class="row" style="animation-delay:0.39s">
    <rect x="40" y="302" width="460" height="44" rx="10" fill="#1a1f22" stroke="#2a3135"/>
    <text x="58" y="320" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11" fill="#8a969c" letter-spacing="0.6">CPSE-C · XJ-77043</text>
    <text x="58" y="337" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="14.5" fill="#e9eef0">STAINLESS STEEL HEXAGONAL BOLT 10MM X 50MM</text>
    <circle cx="500" cy="324" r="3" fill="#5b666c"/>
  </g>
  <g class="row" style="animation-delay:0.51s">
    <rect x="40" y="358" width="460" height="44" rx="10" fill="#1a1f22" stroke="#2a3135"/>
    <text x="58" y="376" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11" fill="#8a969c" letter-spacing="0.6">CPSE-D · 036913</text>
    <text x="58" y="393" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="14.5" fill="#e9eef0">SS HEX BOLT M10X50</text>
    <circle cx="500" cy="380" r="3" fill="#5b666c"/>
  </g>
  <path class="thread" style="animation-delay:0.90s" d="M 500 212 C 640 212, 640 300, 772 300" pathLength="1" fill="none" stroke="url(#th)" stroke-width="2"/><path class="thread" style="animation-delay:1.25s" d="M 500 268 C 640 268, 640 300, 772 300" pathLength="1" fill="none" stroke="url(#th)" stroke-width="2"/><path class="thread" style="animation-delay:1.60s" d="M 500 324 C 640 324, 640 300, 772 300" pathLength="1" fill="none" stroke="url(#th)" stroke-width="2"/><path class="thread" style="animation-delay:1.95s" d="M 500 380 C 640 380, 640 300, 772 300" pathLength="1" fill="none" stroke="url(#th)" stroke-width="2"/>
  <circle r="3.6" fill="#3ccfa4" class="dot" style="animation-delay:0.90s"><animateMotion dur="9s" begin="1.60s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.12;1" calcMode="linear" path="M 500 212 C 640 212, 640 300, 772 300"/></circle><circle r="3.6" fill="#3ccfa4" class="dot" style="animation-delay:1.25s"><animateMotion dur="9s" begin="1.95s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.12;1" calcMode="linear" path="M 500 268 C 640 268, 640 300, 772 300"/></circle><circle r="3.6" fill="#3ccfa4" class="dot" style="animation-delay:1.60s"><animateMotion dur="9s" begin="2.30s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.12;1" calcMode="linear" path="M 500 324 C 640 324, 640 300, 772 300"/></circle><circle r="3.6" fill="#3ccfa4" class="dot" style="animation-delay:1.95s"><animateMotion dur="9s" begin="2.65s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.12;1" calcMode="linear" path="M 500 380 C 640 380, 640 300, 772 300"/></circle>

  <g class="canon">
    <rect x="772" y="226" width="388" height="148" rx="14" fill="#1a1f22" stroke="#3ccfa4" stroke-width="1.4"/>
    <text x="794" y="256" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#8a969c">NATIONAL MATERIAL CODE</text>
    <text x="794" y="288" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="23" font-weight="700" fill="#3ccfa4">NMC-5306-SS-0100-ADT</text>
    <text x="794" y="316" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12.5" fill="#e9eef0">BOLT, MACHINE — STAINLESS STEEL</text>
    <text x="794" y="334" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12.5" fill="#e9eef0">HEXAGONAL — M10 × 50</text>
    <text x="794" y="358" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11" fill="#8a969c"><tspan fill="#3ccfa4">●</tspan> originals kept · human-approved · hash-chained</text>
  </g>

  <text x="40" y="436" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12" letter-spacing="0.4" fill="#8a969c">similarity <tspan fill="#e9eef0">proposes</tspan>  ·  attributes <tspan fill="#e9eef0">decide</tspan>  ·  a critical mismatch is a <tspan fill="#ff6b5b">veto</tspan>, not a penalty</text>
</svg>
