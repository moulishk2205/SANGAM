<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="vt vd">
  <title id="vt">The veto — why text similarity cannot decide identity</title>
  <desc id="vd">Query MS HEX BOLT M10 X 75. Six candidates all score above 0.96 text similarity. Three are the same part and match; three differ on a critical attribute (thread diameter, material, length) and SANGAM scores them exactly zero.</desc>
  <style>
    .tbar, .sm, .sv { transform-box: fill-box; transform-origin: left center; }
    .tbar { animation: grow 10s cubic-bezier(.2,.7,.2,1) infinite; }
    @keyframes grow { 0% { transform: scaleX(0); } 12% { transform: scaleX(1); } 94% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    .tval { animation: fadein 10s linear infinite; }
    @keyframes fadein { 0%, 10% { opacity: 0; } 14%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .sm { animation: sm 10s cubic-bezier(.2,.7,.2,1) infinite; }
    @keyframes sm { 0%, 18% { transform: scaleX(0); } 30%, 94% { transform: scaleX(1); opacity: 1; } 100% { opacity: 0; } }
    .sv { animation: sv 10s cubic-bezier(.2,.7,.2,1) infinite; }
    @keyframes sv { 0%, 18% { transform: scaleX(0); } 30% { transform: scaleX(1); } 40% { transform: scaleX(1); } 44%, 100% { transform: scaleX(0); } }
    .mval { animation: mval 10s linear infinite; }
    @keyframes mval { 0%, 28% { opacity: 0; } 33%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .zval, .tagv { animation: zval 10s linear infinite; }
    @keyframes zval { 0%, 44% { opacity: 0; } 48%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .tagm { animation: mval 10s linear infinite; }
    .flash { animation: flash 10s ease-out infinite; }
    @keyframes flash { 0%, 41% { opacity: 0; } 43% { opacity: .28; } 52%, 100% { opacity: 0; } }
    .note { animation: fadein2 10s linear infinite; }
    @keyframes fadein2 { 0%, 50% { opacity: 0; } 56%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .tbar, .sm, .tval, .mval, .zval, .tagv, .tagm, .note { animation: none !important; opacity: 1; transform: none; }
      .sv { animation: none !important; transform: scaleX(0); }
    }
  </style>
  <rect width="1200" height="560" rx="22" fill="#fbfcfb"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="21.5" fill="none" stroke="#d9e1de"/>

  <text x="40" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#111618">Six look-alikes. Three different parts.</text>
  <text x="40" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#5c686d">Live engine output. A similarity threshold merges all six into the national master; SANGAM refuses three.</text>
  <g font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="13">
    <rect x="852" y="40" width="308" height="34" rx="9" fill="#eef3f1" stroke="#d9e1de"/>
    <text x="868" y="62" fill="#5c686d">query</text>
    <text x="922" y="62" fill="#111618" font-weight="700">MS HEX BOLT M10 X 75</text>
  </g>

