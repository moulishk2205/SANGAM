  <text class="note" x="40" y="500" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="13" fill="#5c686d">p(match) = <tspan fill="#d4432f">veto</tspan> × calibrate(σ(w·x + b))   — the veto multiplies last and is not a feature, so nothing can outvote it.</text>
